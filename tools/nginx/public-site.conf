server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    autoindex off;

    # Les tuiles OSM exigent un Referer : sans lui, le serveur renvoie une
    # tuile « Access blocked ». Rien de secret dans les URL du site public,
    # seule l'origine part vers tile.openstreetmap.org.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /public/index.html =404;
    }

    location = /data/manifest.json {
        alias /srv/public-data/manifest.json;
    }

    location ~ "^/data/versions/(?<version>[a-f0-9]{32})/(?<file>snapshot\.json|overview\.json|track\.json|days/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json)$" {
        alias /srv/public-data/versions/$version/$file;
    }

    location ~ ^/(public/(app|data|summary)\.js|public/style\.css|style\.css|components/(map|point-bubble|current-country)\.js|features/track-picking\.js|utils/time\.js|vendor/leaflet\.(js|css)|vendor/images/[a-zA-Z0-9_-]+\.png)$ {
        try_files $uri =404;
    }

    # No API proxy, credentials, diagnostic pages or directory listing.
    location / {
        return 404;
    }
}

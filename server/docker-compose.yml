services:
  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madhi_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-madhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-madhi_dev_password}
    volumes:
      # Volume a sauvegarder : si ces donnees disparaissent, les positions serveur disparaissent.
      - madhi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://madhi:madhi_dev_password@postgres:5432/madhi_tracker}
      DEVICE_TOKEN_HASH_SECRET: ${DEVICE_TOKEN_HASH_SECRET:-dev-secret-change-me}
      ACTIVATION_CODE_HASH_SECRET: ${ACTIVATION_CODE_HASH_SECRET:-dev-secret-change-me}
      INITIAL_TRIP_ID: ${INITIAL_TRIP_ID:-8f14e45f-ceea-467a-9f4e-2b1c9a1a1a1a}
      INITIAL_TRIP_NAME: ${INITIAL_TRIP_NAME:-Madhi 2026}
      INITIAL_ACTIVATION_CODE: ${INITIAL_ACTIVATION_CODE:-XXXX-XXXX}
      PUBLIC_READ_TOKEN: ${PUBLIC_READ_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Le relais d'adresse. Sans ces trois lignes, les valeurs posees dans
      # server/.env restent au niveau de compose -- qui s'en sert pour
      # substituer des ${...}, pas pour transmettre -- et n'atteignent jamais
      # le conteneur. L'option s'allumerait dans le fichier et nulle part
      # ailleurs, ce qui est la panne la plus difficile a voir : la
      # configuration a l'air juste et le serveur repond « eteint ».
      REVERSE_GEOCODE_ENABLED: ${REVERSE_GEOCODE_ENABLED:-false}
      REVERSE_GEOCODE_URL: ${REVERSE_GEOCODE_URL:-https://nominatim.openstreetmap.org/reverse}
      REVERSE_GEOCODE_USER_AGENT: ${REVERSE_GEOCODE_USER_AGENT:-}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://madhi:madhi_dev_password@postgres:5432/madhi_tracker}
      DEVICE_TOKEN_HASH_SECRET: ${DEVICE_TOKEN_HASH_SECRET:-dev-secret-change-me}
      ACTIVATION_CODE_HASH_SECRET: ${ACTIVATION_CODE_HASH_SECRET:-dev-secret-change-me}
      INITIAL_TRIP_ID: ${INITIAL_TRIP_ID:-8f14e45f-ceea-467a-9f4e-2b1c9a1a1a1a}
      INITIAL_TRIP_NAME: ${INITIAL_TRIP_NAME:-Madhi 2026}
      INITIAL_ACTIVATION_CODE: ${INITIAL_ACTIVATION_CODE:-XXXX-XXXX}
      ACTIVATION_CODE_TTL_MINUTES: ${ACTIVATION_CODE_TTL_MINUTES:-60}
      MAX_BATCH_POINTS: ${MAX_BATCH_POINTS:-200}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PUBLIC_READ_TOKEN: ${PUBLIC_READ_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_BIND:-127.0.0.1:8111}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12

  site:
    # Le site familial, servi depuis la stack et non depuis l'hote : le
    # repertoire site/ du depot est monte tel quel, donc le fichier du depot est
    # litteralement le fichier servi, sans copie qui puisse deriver.
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # Sans segment, le lien familial n'existe pas : mieux vaut un refus franc
      # au demarrage qu'un site en ligne a une adresse devinable.
      SITE_SECRET_SEGMENT: ${SITE_SECRET_SEGMENT:?definir SITE_SECRET_SEGMENT dans server/.env (openssl rand -hex 16)}
      # Le meme token que l'API : une seule valeur, un seul endroit.
      PUBLIC_READ_TOKEN: ${PUBLIC_READ_TOKEN:-}
      # Limite la substitution a ces deux noms, pour que $$remote_addr et ses
      # semblables survivent au passage d'envsubst.
      NGINX_ENVSUBST_FILTER: "^(SITE_SECRET_SEGMENT|PUBLIC_READ_TOKEN)$$"
    volumes:
      - ../site:/usr/share/nginx/site:ro
      # Le fond de carte, fabrique par tools/tiles et versionne comme le reste :
      # le fichier du depot est litteralement le fichier servi.
      - ../tools/tiles/tuiles:/usr/share/nginx/tiles:ro
      - ../tools/nginx/site.conf.template:/etc/nginx/templates/default.conf.template:ro
      # A creer avant le premier demarrage : un fichier manquant deviendrait un
      # repertoire vide, et nginx refuserait de demarrer.
      - ./madhi.htpasswd:/etc/nginx/madhi.htpasswd:ro
    ports:
      - "${SITE_BIND:-127.0.0.1:8112}:80"
    depends_on:
      # service_started, et non service_healthy : le site doit pouvoir
      # s'afficher pour annoncer que le serveur ne repond pas. Le faire
      # dependre de la sante de l'API le rendrait muet au moment ou il est le
      # plus utile.
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/_up"]
      interval: 30s
      timeout: 3s
      retries: 3

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      MADHI_TEST_INTEGRATION: "1"
      MADHI_TEST_BASE_URL: http://api:8080/api/v1
      TEST_DATABASE_URL: postgresql://madhi:madhi_dev_password@postgres:5432/madhi_tracker
      ACTIVATION_CODE_HASH_SECRET: ${ACTIVATION_CODE_HASH_SECRET:-dev-secret-change-me}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  madhi_postgres_data:
